CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB_LOGGING=n

CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# SK6812 (WS2812) LEDドライバー有効化
CONFIG_LED_STRIP=y

# ==========================================
# Bluetooth接続の安定化設定（接続ループ対策）
# ==========================================

# 1. 送信電力を最大 (+8dBm) に設定
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 2. PHY 2Mbps を無効化する（最重要：PC再起動後の切断ループを防止）
CONFIG_BT_CTLR_PHY_2M=n

# 3. GATT サブスクリプション制限の緩和（再接続時のセッションエラー防止）
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
